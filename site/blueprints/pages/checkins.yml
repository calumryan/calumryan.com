title: Checkins

# This tells Kirby what child templates are allowed
pages:
  template:
    - checkin  # allow creating checkin pages
  draft: true # optional: allow drafts

icon: 🗺

sections:
  list:
    type: pages
    template: checkin
    headline: All checkins
    sortable: true
    sortBy: date desc

columns:
  - width: 1/2
    sections:
      drafts:
        extends: sections/checkins
        headline: Drafts
        status: draft

  - width: 1/2
    sections:
      listed:
        extends: sections/checkins
        headline: Published
        status: listed
