title: Checkin
icon: 🗺
num: date
# options:
#   create: true
#   update: true

status:
  draft:
    label: Draft
    text: Draft mode
  unlisted:
    label: In Review
    text: Online but not listed
  listed:
    label: Published
    text: Online and listed

tabs:
  content:
    label: Content
    columns:
      - width: 2/3
        type: fields
        fields:
          title:
            type: text
            readonly: true

          text:
            type: textarea
            size: small
            readonly: true

          syndication:
            label: Syndication (legacy single URL)
            type: url
            readonly: true

          urls:
            label: Syndication URLs
            type: textarea
            readonly: true

          location_data:
            label: Location data (h-card JSON)
            type: textarea
            readonly: true

          address_data:
            label: Address data (h-adr JSON)
            type: textarea
            readonly: true

          weather_icon:
            label: Weather icon
            type: text
            readonly: true

          temperature:
            label: Temperature
            type: text
            readonly: true


      - width: 1/3
        type: fields
        fields:
          date:
            type: date
            time: true
            readonly: true

          feature_images:
            label: Images
            type: files
            query: page.images
            multiple: true
            uploads: true
            min: 0
            max: 8
            cover: true

          tags:
            type: tags

  meta:
    label: Legacy content
    columns:
      - width: 1/2
        type: fields
        fields:
          redirect:
            type: text

          feature_image:
            type: text

          alternative_text:
            type: text

      - width: 1/2
        type: fields
        fields:
          latitude:
            type: text
            readonly: true
          longitude:
            type: text
            readonly: true